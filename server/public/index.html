<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Plug Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: #1a1d27;
      border-radius: 1.5rem;
      border: 1px solid #2d3148;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      min-width: 280px;
    }

    .plug-name {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .indicator {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: background 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
    }

    .indicator.on {
      background: #14532d;
      color: #4ade80;
      box-shadow: 0 0 32px rgba(74, 222, 128, 0.35);
    }

    .indicator.off {
      background: #3f1d1d;
      color: #f87171;
      box-shadow: 0 0 32px rgba(248, 113, 113, 0.25);
    }

    .indicator.unknown {
      background: #2d2d2d;
      color: #94a3b8;
      box-shadow: none;
    }

    .status-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .last-changed {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      min-height: 1.1em;
    }

    .refresh-bar {
      width: 100%;
      height: 3px;
      background: #2d3148;
      border-radius: 2px;
      overflow: hidden;
    }

    .refresh-bar-fill {
      height: 100%;
      background: #4f6ef7;
      border-radius: 2px;
      width: 100%;
      animation: countdown 10s linear infinite;
    }

    @keyframes countdown {
      from { width: 100%; }
      to   { width: 0%; }
    }

    .error-msg {
      font-size: 0.75rem;
      color: #f87171;
      margin-top: 1rem;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="plug-name" id="plug-name">Loading...</div>
    <div class="indicator unknown" id="indicator">—</div>
    <div class="status-text" id="status-text">Connecting</div>
    <div class="last-changed" id="last-changed"></div>
    <div class="refresh-bar"><div class="refresh-bar-fill" id="bar"></div></div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <script>
    const REFRESH_MS = 10000;

    const indicatorEl  = document.getElementById('indicator');
    const statusTextEl = document.getElementById('status-text');
    const plugNameEl   = document.getElementById('plug-name');
    const lastChangedEl= document.getElementById('last-changed');
    const errorMsgEl   = document.getElementById('error-msg');
    const barEl        = document.getElementById('bar');

    function formatRelative(isoString) {
      if (!isoString) return '';
      const diff = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
      if (diff < 60)  return `Changed ${diff}s ago`;
      if (diff < 3600) return `Changed ${Math.floor(diff / 60)}m ago`;
      return `Changed ${Math.floor(diff / 3600)}h ago`;
    }

    function applyState(state, name, lastChanged) {
      plugNameEl.textContent = name;
      errorMsgEl.textContent = '';

      const normalized = (state || '').toLowerCase();
      indicatorEl.className = `indicator ${normalized === 'on' ? 'on' : normalized === 'off' ? 'off' : 'unknown'}`;
      indicatorEl.textContent = normalized === 'on' ? 'ON' : normalized === 'off' ? 'OFF' : '?';
      statusTextEl.textContent = normalized === 'on' ? 'Online' : normalized === 'off' ? 'Offline' : 'Unknown';
      lastChangedEl.textContent = formatRelative(lastChanged);
      document.title = `${name} — ${(state || '?').toUpperCase()}`;
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.error && !data.state) {
          errorMsgEl.textContent = data.error;
          applyState('unknown', data.name || 'Smart Plug', null);
        } else {
          applyState(data.state, data.name, data.last_changed);
          if (data.error) errorMsgEl.textContent = data.error;
        }
      } catch (err) {
        errorMsgEl.textContent = 'Could not reach server';
        applyState('unknown', 'Smart Plug', null);
      }
    }

    function resetBar() {
      barEl.style.animation = 'none';
      barEl.offsetHeight; // reflow
      barEl.style.animation = '';
    }

    fetchStatus();
    setInterval(() => { fetchStatus(); resetBar(); }, REFRESH_MS);
  </script>
</body>
</html>
